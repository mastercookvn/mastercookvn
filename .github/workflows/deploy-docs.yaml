name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - mise.toml
      - ".github/workflows/deploy-docs.yaml"
      - ".tool-versions"
      - "!**/README.md"
      - "!**/AGENTS.md"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOCS_LOCAL_KROKI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Restore Docs diagrams Cache
        id: diagrams-cache
        uses: actions/cache/restore@v6
        with:
          path: docs/src/public/diagrams/
          key: docs-diagrams-
          restore-keys: |
            docs-diagrams-

      - name: Install dependencies
        run: pnpm install

      - name: Build docs
        run: pnpm --filter @mastercookvn/docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Calculate Docs diagrams Cache Key
        id: cache-key
        run: |
          mkdir -p docs/src/public/diagrams
          hash="$(find docs/src/public/diagrams -type f -print0 | sort -z | xargs -0 -r sha256sum | sha256sum | cut -d ' ' -f 1)"
          echo "cache_key=docs-diagrams-$hash" >> "$GITHUB_OUTPUT"

      - name: Cache Docs diagrams
        if: steps.cache-key.outputs.cache_key != steps.diagrams-cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: docs/src/public/diagrams/
          key: ${{ steps.cache-key.outputs.cache_key }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
