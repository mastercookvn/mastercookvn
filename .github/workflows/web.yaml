name: Web

on:
  push:
    branches:
      - main
    paths: &paths
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".prettierignore"
      - "mise.toml"
      - "web.Dockerfile"
      - ".github/workflows/web.yaml"
      - "!**/*.md"
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      release:
        description: Push the image to GHCR
        type: boolean
        default: false
      tag:
        description: Image tag (defaults to the commit SHA)
        type: string
        required: false

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm --filter @mastercookvn/web build

      - name: Docker build
        run: docker build -f web.Dockerfile -t mastercookvn-web:${{ github.sha }} .

      - name: Login to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release image to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          IMAGE: ghcr.io/${{ github.repository }}/web
          TAG: ${{ inputs.tag }}
        run: |
          IMAGE="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          TAG="${TAG:-${{ github.sha }}}"
          docker tag "mastercookvn-web:${{ github.sha }}" "$IMAGE:$TAG"
          docker tag "mastercookvn-web:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
