packages:
  - docs
  - web

autoInstallPeers: true

catalog:
  # docs
  "@catppuccin/vitepress": 0.1.4
  "get-port": 7.2.0
  "markdown-it-mathjax3": ^4
  "pagefind": 1.5.2
  "vitepress": 2.0.0-alpha.20
  "vitepress-mermaid-renderer": 1.2.2
  "vitepress-plugin-diagrams": 1.3.1
  "vitepress-plugin-pagefind": 0.4.25
  "vitepress-sidebar": 1.40.0
  "wait-on": 9.0.10

  # web
  "next": ^16.4.4
  "react": ^19.3.1
  "react-dom": ^19.3.1
  "tailwindcss": ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  "postcss": ^8.5.32
  "lucide-react": 1.62.0

  # testing
  "vitest": ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  "vite": ^8.3.5
  "@vitejs/plugin-react": ^6.2.1
  "jsdom": ^30.1.3
  "@testing-library/react": ^16.3.3
  "@testing-library/jest-dom": ^7.0.1

  # lint & format
  "eslint": ^9.39.5
  "eslint-config-next": ^16.4.4
  "eslint-config-prettier": ^10.1.8
  "eslint-plugin-prettier": ^5.5.7
  "prettier": ^3.9.10
  "prettier-plugin-tailwindcss": ^0.8.1

  # types
  "@typescript/native": "npm:typescript@^7.0.2"
  "typescript": "npm:@typescript/typescript6@^6.0.2"
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0

allowBuilds:
  esbuild: true
  vue-demi: true

minimumReleaseAgeExclude:
  - "@next/env@16.4.4"
  - "@next/eslint-plugin-next@16.4.4"
  - "@next/swc-darwin-arm64@16.4.4"
  - "@next/swc-darwin-x64@16.4.4"
  - "@next/swc-linux-arm64-gnu@16.4.4"
  - "@next/swc-linux-arm64-musl@16.4.4"
  - "@next/swc-linux-x64-gnu@16.4.4"
  - "@next/swc-linux-x64-musl@16.4.4"
  - "@next/swc-win32-arm64-msvc@16.4.4"
  - "@next/swc-win32-x64-msvc@16.4.4"
  - "@vitejs/plugin-react@6.2.1"
  - eslint-config-next@16.4.4
  - next@16.4.4
